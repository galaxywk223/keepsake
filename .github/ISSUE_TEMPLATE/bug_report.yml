name: 问题反馈 / Bug report
description: 报告功能异常或崩溃 / Report a bug or crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复。**请不要粘贴 Cookie、账号信息或其他个人数据。**
        Please search existing issues first. **Do not paste cookies, account details, or other personal data.**
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options:
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 在设置页查看，例如 1.3.0 / Shown in Settings, e.g. 1.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本 / OS version
      placeholder: Windows 11 23H2 / Android 14
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / What happened
      description: 实际发生了什么，你期望的结果是什么 / What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 发布前请删除链接中的个人标识信息 / Remove personal identifiers from links before posting
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我已确认内容不包含 Cookie、账号或其他个人数据 / I confirm this report contains no cookies, account details, or personal data
          required: true
        - label: 我已阅读并同意免责声明 / I have read and agree to the [Disclaimer](https://github.com/galaxywk223/keepsake/blob/main/DISCLAIMER.md)
          required: true
